name: Daily Top20 V2 offline tests
on:
  push:
    branches: ['hasol/daily-top20-v2-20261125']
  pull_request:
    paths: ['scripts/daily_top20_v2.py', '.github/workflows/daily-top20-v2-test.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/daily_top20_v2.py self-test
