name: HASOL Web Candidate Quant v1

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'hasol_quant/**'
      - 'scripts/run_web_candidate_quant.py'
      - 'tests/test_quant_engine.py'
      - 'tests/test_web_candidate_quant.py'
      - 'runtime/web_candidates/**'
      - 'requirements-quant.txt'
      - '.github/workflows/full-market-quant.yml'
  push:
    branches: [main]
    paths:
      - 'hasol_quant/**'
      - 'scripts/run_web_candidate_quant.py'
      - 'tests/test_web_candidate_quant.py'
      - 'runtime/web_candidates/latest.json'
      - 'requirements-quant.txt'
      - '.github/workflows/full-market-quant.yml'

permissions:
  contents: read

jobs:
  web-candidate-quant:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-quant.txt

      - name: Install Quant dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-quant.txt

      - name: Unit tests
        run: |
          python -m pytest -q tests/test_quant_engine.py tests/test_web_candidate_quant.py

      - name: CLI smoke test
        run: python -m scripts.run_web_candidate_quant --help

      - name: Run Web-candidate Quant
        run: |
          rm -rf output_web_quant
          python -m scripts.run_web_candidate_quant \
            --input runtime/web_candidates/latest.json \
            --output-dir output_web_quant

      - name: Verify artifacts and source boundary
        shell: bash
        run: |
          set -euo pipefail
          for f in run_manifest.json data_quality.json input_snapshot.json candidate_features.csv web_candidate_quant.csv quant_top50.csv quant_top50.json; do
            test -s "output_web_quant/$f"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('output_web_quant/run_manifest.json').read_text())
          assert m['quant_market_source']=='YAHOO_YFINANCE_DETECTION_ONLY'
          assert m['quant_source_policy']=='DETECTION_ONLY_NOT_CANONICAL'
          assert m['final_market_validator']=='ALPACA_CONNECTED_APP'
          print(m['quality'])
          PY

      - name: Upload Quant artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hasol-web-candidate-quant-${{ github.run_id }}
          path: output_web_quant/**
          if-no-files-found: warn
          retention-days: 90
