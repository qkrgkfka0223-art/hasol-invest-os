name: HASOL Legacy Detector Regression

on:
  pull_request:
    branches:
      - main
    paths:
      - "hasol_detector/**"
      - "scripts/build_live_universe.py"
      - ".github/workflows/hasol-detector-run.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HASOL_LEGACY_NON_OFFICIAL: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build legacy sampled universe
        run: |
          python scripts/build_live_universe.py
          test "$(($(wc -l < universe_live.csv) - 1))" -ge 300

      - name: Run legacy detector regression only
        shell: bash
        run: |
          set -o pipefail
          mkdir -p output_legacy
          python main.py --mode live --universe-csv universe_live.csv --output-dir output_legacy --max-tickers 300 --market-code SOFT_GO 2>&1 | tee output_legacy/run.log

      - name: Assert legacy run is not official v3
        shell: bash
        run: |
          test "$HASOL_LEGACY_NON_OFFICIAL" = "1"
          test ! -e output_legacy/OFFICIAL_V3_PREDICTION.json

      - name: Upload legacy regression outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hasol-legacy-detector-regression
          path: |
            universe_live.csv
            output_legacy/**
          if-no-files-found: warn
