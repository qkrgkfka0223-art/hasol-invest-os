name: HASOL Web Candidate Quant v2

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web-candidate-quant:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-quant.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-quant.txt
      - name: Unit tests
        run: |
          python -m pytest -q tests/test_quant_engine.py tests/test_web_candidate_quant.py tests/test_web_event_model.py tests/test_hasol_judgment_spec.py
      - name: Verify no Alpaca secret boundary
        run: |
          set -euo pipefail
          ! grep -R -n -E 'APCA_API_KEY|ALPACA_API_KEY|APCA_API_SECRET|ALPACA_SECRET' .github/workflows/web-candidate-quant.yml scripts/run_web_candidate_quant.py
          python -m scripts.run_web_candidate_quant --help
      - name: Run Web-candidate Quant
        run: |
          rm -rf output_web_quant
          python -m scripts.run_web_candidate_quant --input runtime/web_candidates/latest.json --output-dir output_web_quant
      - name: Verify artifacts and source boundary
        run: |
          set -euo pipefail
          for f in run_manifest.json data_quality.json input_snapshot_raw.json input_snapshot_normalized.json candidate_features.csv web_candidate_quant.csv quant_top50.csv quant_top50.json; do test -s "output_web_quant/$f"; done
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('output_web_quant/run_manifest.json').read_text())
          assert m['schema_version']=='HASOL-WEB-CANDIDATES-v2'
          assert m['event_source_policy']=='OFFICIAL_PRIMARY_REQUIRED_FOR_PRODUCTION'
          assert m['quant_market_source']=='YAHOO_YFINANCE_DETECTION_ONLY'
          assert m['quant_source_policy']=='DETECTION_ONLY_NOT_CANONICAL'
          assert m['final_market_validator']=='ALPACA_CONNECTED_APP'
          print(m['quality'])
          PY
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hasol-web-candidate-quant-${{ github.run_id }}
          path: output_web_quant/**
          if-no-files-found: warn
          retention-days: 90
