name: HASOL Web Candidate Quant CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - 'runtime/web_candidates/**'

permissions:
  contents: read

jobs:
  web-candidate-quant-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-quant.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-quant.txt
      - name: Unit tests
        run: python -m pytest -q tests
      - name: Verify no Alpaca secret boundary
        run: |
          set -euo pipefail
          if grep -n -E 'APCA_API_KEY|ALPACA_API_KEY|APCA_API_SECRET|ALPACA_SECRET' \
            scripts/run_web_candidate_quant.py \
            hasol_detector/web_event_model.py \
            hasol_quant/features.py \
            hasol_quant/ranker.py \
            hasol_quant/yahoo_client.py \
            hasol_judgment/spec.py; then
            echo 'ERROR: Web-candidate Quant path references Alpaca credentials' >&2
            exit 1
          fi
          python -m scripts.run_web_candidate_quant --help
      - name: Run Web-candidate Quant system smoke
        run: |
          rm -rf output_web_quant
          python -m scripts.run_web_candidate_quant --input runtime/web_candidates/latest.json --output-dir output_web_quant
      - name: Run 3-day future-blocked E2E Quant with freeze gate
        run: |
          set -euo pipefail
          rm -rf output_e2e
          for day in 2026-08-24 2026-08-25 2026-08-26; do
            out="output_e2e/$day"
            python -m scripts.run_web_candidate_quant \
              --input "runtime/e2e/$day.json" \
              --output-dir "$out" \
              --require-freeze-ready
            echo "=== E2E $day QUANT TOP ==="
            cat "$out/quant_top50.csv"
          done
      - name: Verify artifacts, lineage and freeze readiness
        run: |
          set -euo pipefail
          for f in run_manifest.json data_quality.json input_snapshot_raw.json input_snapshot_normalized.json candidate_features.csv web_candidate_quant.csv quant_top50.csv quant_top50.json; do test -s "output_web_quant/$f"; done
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('output_web_quant/run_manifest.json').read_text())
          assert m['schema_version']=='HASOL-WEB-CANDIDATES-v2'
          assert m['event_source_policy']=='OFFICIAL_PRIMARY_REQUIRED_FOR_PRODUCTION'
          assert m['quant_market_source']=='YAHOO_YFINANCE_DETECTION_ONLY'
          assert m['quant_source_policy']=='DETECTION_ONLY_NOT_CANONICAL'
          assert m['final_market_validator']=='ALPACA_CONNECTED_APP'
          print('system smoke', m['quality'])
          for day in ['2026-08-24','2026-08-25','2026-08-26']:
              p=Path('output_e2e')/day
              em=json.loads((p/'run_manifest.json').read_text())
              q=em['quality']
              assert em['run_type']=='E2E_SIM'
              assert em['eligible_for_prediction'] is True
              assert em['cutoff_et']==f'{day}T09:25:00-04:00'
              assert q['input_candidates'] >= 5
              assert q['market_data_coverage'] >= q['min_market_data_coverage']
              assert q['quant_eligible'] >= q['min_freeze_candidates']
              assert q['quant_ranked'] >= q['min_freeze_candidates']
              assert q['freeze_ready'] is True
              assert q['quality_status']=='PASS'
              assert (p/'quant_top50.csv').exists()
              print(day, q)
          PY
      - name: Upload CI artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hasol-web-candidate-quant-ci-${{ github.run_id }}
          path: |
            output_web_quant/**
            output_e2e/**
          if-no-files-found: warn
          retention-days: 90
