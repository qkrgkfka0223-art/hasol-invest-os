name: HASOL Brain Handoff Audit Tests

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "scripts/validate_brain_handoff.py"
      - "tests/test_brain_handoff.py"
      - "scripts/audit_matured_backlog.py"
      - "tests/test_matured_backlog.py"
      - "scripts/audit_discovery_freshness.py"
      - "tests/test_discovery_freshness.py"
      - "tests/test_precommit_bundle.py"
      - "scripts/audit_learning_loop.py"
      - "tests/test_learning_loop.py"
      - "docs/LEARNING_LOOP_SHADOW.md"
      - "docs/BRAIN_HANDOFF.md"
      - "docs/PREFREEZE_SOURCE_GATE.md"
      - ".github/workflows/brain-handoff-audit.yml"
  push:
    branches: [main]
    paths:
      - "scripts/validate_brain_handoff.py"
      - "tests/test_brain_handoff.py"
      - "scripts/audit_matured_backlog.py"
      - "tests/test_matured_backlog.py"
      - "scripts/audit_discovery_freshness.py"
      - "tests/test_discovery_freshness.py"
      - "tests/test_precommit_bundle.py"
      - "scripts/audit_learning_loop.py"
      - "tests/test_learning_loop.py"
      - "docs/LEARNING_LOOP_SHADOW.md"
      - ".github/workflows/brain-handoff-audit.yml"

permissions:
  contents: read

jobs:
  handoff-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install "pytest>=8,<10"
      - name: Validate Frozen, backlog, source-freshness and discovery gates
        run: python -m pytest -q tests/test_brain_handoff.py tests/test_matured_backlog.py tests/test_discovery_freshness.py tests/test_precommit_bundle.py tests/test_learning_loop.py
      - name: Check audit script CLIs
        run: |
          python -m scripts.validate_brain_handoff --help
          python -m scripts.audit_discovery_freshness --help
          python -m scripts.audit_matured_backlog --help
          python -m scripts.audit_learning_loop --help
