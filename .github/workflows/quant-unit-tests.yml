name: HASOL Quant Unit Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'hasol_quant/**'
      - 'scripts/run_full_market_quant.py'
      - 'tests/test_quant_engine.py'
      - 'requirements.txt'
      - '.github/workflows/full-market-quant.yml'
      - '.github/workflows/quant-unit-tests.yml'
  push:
    branches: [main]
    paths:
      - 'hasol_quant/**'
      - 'scripts/run_full_market_quant.py'
      - 'tests/test_quant_engine.py'
      - 'requirements.txt'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - run: python -m pytest -q tests/test_quant_engine.py
