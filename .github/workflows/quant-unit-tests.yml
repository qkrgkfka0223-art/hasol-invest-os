name: HASOL Quant Unit Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-quant.txt
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-quant.txt
      - run: python -m pytest -q tests
      - run: python -m scripts.run_web_candidate_quant --help
