name: HASOL mover backtest

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  mover-backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run sample mover backtest
        run: |
          python -m hasol_detector.main \
            --sample \
            --build-movers \
            --mover-lookback-days 14 \
            --output-dir output_mover_sample

      - name: Upload mover backtest outputs
        uses: actions/upload-artifact@v4
        with:
          name: hasol-mover-backtest-output
          path: output_mover_sample/
          retention-days: 30
