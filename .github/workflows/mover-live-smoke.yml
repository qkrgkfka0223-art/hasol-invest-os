name: HASOL live mover smoke

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  live-mover-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run live mover smoke
        run: |
          python -m hasol_detector.mover_live \
            --output-dir output_mover_live_smoke \
            --max-tickers 600 \
            --lookback-days 14 \
            --period 1mo

      - name: Upload live mover smoke outputs
        uses: actions/upload-artifact@v4
        with:
          name: hasol-live-mover-smoke-output
          path: output_mover_live_smoke/
          retention-days: 30
