name: HASOL Model Loop v3

on:
  push:
    branches:
      - "hasol/model-loop-v3-runtime"
  pull_request:
    paths:
      - "hasol_runtime/**"
      - "tests/**"
      - "scripts/probe_alpaca_bridge.py"
      - ".github/workflows/hasol-model-loop-v3.yml"

jobs:
  runtime-contract:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --upgrade pip pytest
      - name: Run fail-closed runtime, market adapter, and learning-loop tests
        run: pytest -q tests/test_model_loop_v3.py tests/test_alpaca_market_adapter_v3.py tests/test_review_loop_v3.py

  alpaca-bridge-probe:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
      APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe GitHub to Alpaca live-data bridge
        run: python scripts/probe_alpaca_bridge.py
