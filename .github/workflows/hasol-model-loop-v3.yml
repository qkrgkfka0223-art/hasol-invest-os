name: HASOL Model Loop v3

on:
  push:
    branches:
      - "hasol/model-loop-v3-runtime"
  pull_request:
    paths:
      - "hasol_runtime/**"
      - "tests/test_model_loop_v3.py"
      - ".github/workflows/hasol-model-loop-v3.yml"

jobs:
  runtime-contract:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --upgrade pip pytest
      - name: Run fail-closed runtime tests
        run: pytest -q tests/test_model_loop_v3.py
