name: HASOL Top20 Backstop Test

on:
  workflow_dispatch:
  push:
    branches:
      - hasol-top20-backstop-runner-20260901
    paths:
      - 'scripts/build_top20_backstop.py'
      - '.github/workflows/top20-backstop-test.yml'
      - 'data/candidate_universe.csv'
      - 'hasol_quant/**'
      - 'runtime/preopen_checkpoints/**'

permissions:
  contents: read

jobs:
  build-top20:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
      ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
      HASOL_BATCH_SIZE: '50'
      HASOL_MAX_RETRIES: '3'
      HASOL_HTTP_TIMEOUT: '30'
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-quant.txt
      - name: Install dependencies
        run: pip install -r requirements-quant.txt
      - name: Build exact Top20 backstop
        run: |
          set -euo pipefail
          rm -rf output_top20_backstop
          python -m scripts.build_top20_backstop --output output_top20_backstop/result.json
      - name: Assert exact Top20 invariant
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          raw = json.loads(Path('output_top20_backstop/result.json').read_text())
          top20 = raw['fused_top20']
          assert raw['schema'] == 'HASOL-TOP20-BACKSTOP-v1'
          assert raw['top20_contract'] == 'HASOL-TOP20-EXACT-v1'
          assert raw['valid_exact_top20'] is True
          assert len(top20) == 20
          assert len(set(top20)) == 20
          assert raw['backstop_count'] == raw['backstop_needed']
          assert raw.get('market_data_coverage_pct', 100.0) >= 80.0
          print('EXACT_TOP20_PASS', top20)
          PY
      - name: Upload Top20 artifact
        uses: actions/upload-artifact@v7
        with:
          name: hasol-top20-backstop-${{ github.run_id }}
          path: output_top20_backstop/result.json
          if-no-files-found: error
          retention-days: 30
