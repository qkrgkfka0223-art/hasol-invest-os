name: HASOL Preopen Checkpoint Validate

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/preopen-checkpoint-validate.yml'
      - 'scripts/validate_preopen_checkpoint.py'
      - 'tests/test_preopen_checkpoint_validation.py'
      - 'runtime/preopen_checkpoints/**'
      - 'hasol_detector/web_event_model.py'
      - 'tests/test_web_event_model.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/preopen-checkpoint-validate.yml'
      - 'scripts/validate_preopen_checkpoint.py'
      - 'tests/test_preopen_checkpoint_validation.py'
      - 'runtime/preopen_checkpoints/**'
      - 'hasol_detector/web_event_model.py'
      - 'tests/test_web_event_model.py'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Run checkpoint and schema tests
        run: pytest -q tests/test_preopen_checkpoint_validation.py tests/test_web_event_model.py
      - name: Validate all committed preopen checkpoints
        run: python -m scripts.validate_preopen_checkpoint runtime/preopen_checkpoints
